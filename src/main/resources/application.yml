# MockHub 应用配置

server:
  # 默认 18080，与启动脚本 mockhub.sh / mockhub.bat 保持一致；8080 容易被占用
  port: 18080
  tomcat:
    # 表单提交大小限制，支持 5~6MB 的大文本响应体
    max-http-form-post-size: 10MB

spring:
  # SQLite 数据源配置，使用 data.path 变量支持启动参数覆盖路径
  datasource:
    url: jdbc:sqlite:${data.path:./data}/mockhub.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # Multipart 总入口上限；Mock 响应文件仍受 mock.file.max-size-bytes 的独立 10MB 限制。
      max-file-size: 100MB
      max-request-size: 110MB

# ===== 自定义配置 =====

# 数据目录，所有持久化文件（SQLite 数据库、WSDL 文件等）存放于此
# 可通过启动参数覆盖：--data.path=D:/mockhub/data
data:
  path: ./data

# 独立文件服务器；部署到反向代理后可指定外部可访问的基地址（含 context path）。
file-server:
  max-size-bytes: 104857600
  public-base-url: ""

# 日志保留策略配置
# mode=count 时按条数保留，mode=days 时按天数保留
log:
  retain:
    mode: count
    count: 1000
    days: 30

# Mock 请求的 CORS 配置
mock:
  cors:
    enabled: true
  file:
    # 文件类型 Mock 响应的单文件上传大小上限
    max-size-bytes: 10485760
    # 自动清理超过保留时间且未被任何返回体引用的孤儿文件
    orphan-auto-cleanup-enabled: true
    orphan-retention-hours: 24
    orphan-cleanup-interval-ms: 3600000
