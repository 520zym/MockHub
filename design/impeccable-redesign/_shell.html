<!-- ===================== 墨色状态条 48px（全局固定） ===================== -->
<header class="chrome">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="1" y="1" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M4 12.5 6.5 5l3 7 2.5-7 2 7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    MockHub
  </div>
  <button class="chrome__team" type="button" aria-label="切换团队，当前团队 交易中台">
    <svg width="14" height="14" aria-hidden="true"><use href="#i-teams"/></svg>
    <b>交易中台</b>
    <svg width="12" height="12" aria-hidden="true"><use href="#i-chevron-down"/></svg>
  </button>
  <div class="chrome__url">
    <svg width="13" height="13" aria-hidden="true"><use href="#i-lock"/></svg>
    <span class="mono">mockhub.local:8080/t/acme</span>
    <button class="icon-btn" type="button" aria-label="复制 Mock 基地址" data-copy="http://mockhub.local:8080/t/acme">
      <svg aria-hidden="true"><use href="#i-copy"/></svg>
    </button>
  </div>
  <div class="chrome__spacer"></div>
  <span class="lamp lamp--live">运行中 · 今日 1,284 次</span>
  <span class="chrome__sep" aria-hidden="true"></span>
  <button class="chrome__assist" type="button" aria-label="打开对话助手">
    <svg width="14" height="14" aria-hidden="true"><use href="#i-bolt"/></svg>
    助手
  </button>
  <button class="chrome__user" type="button" aria-label="账号菜单，张一鸣 超级管理员">
    <span class="avatar">张</span>
    张一鸣
  </button>
</header>

<div class="shell">
  <!-- ===================== 左侧导航 232px ===================== -->
  <nav class="rail" aria-label="主导航">
    <div class="rail__group">
      <div class="rail__label">工作区</div>
      <a class="rail__item" href="02-api-list.html"><svg aria-hidden="true"><use href="#i-api"/></svg>接口<span class="count">128</span></a>
      <a class="rail__item" href="#"><svg aria-hidden="true"><use href="#i-files"/></svg>文件服务器</a>
      <a class="rail__item" href="#"><svg aria-hidden="true"><use href="#i-variables"/></svg>动态变量</a>
      <a class="rail__item" href="05-stats.html"><svg aria-hidden="true"><use href="#i-stats"/></svg>使用统计</a>
      <a class="rail__item" href="04-logs.html"><svg aria-hidden="true"><use href="#i-logs"/></svg>日志记录</a>
    </div>
    <div class="rail__group">
      <div class="rail__label">管理</div>
      <a class="rail__item" href="#"><svg aria-hidden="true"><use href="#i-users"/></svg>账号管理</a>
      <a class="rail__item" href="07-teams.html"><svg aria-hidden="true"><use href="#i-teams"/></svg>团队管理</a>
      <a class="rail__item" href="#"><svg aria-hidden="true"><use href="#i-settings"/></svg>全局设置</a>
    </div>
    <div class="rail__foot">
      <b>v1.4.6 · 内网</b>
      <span>SQLite · 单文件数据</span>
    </div>
  </nav>

  <!-- ===================== 内容区 ===================== -->
  <main class="main settle">
    <header class="page-head">
      <div class="page-head__title">
        <h1>页面标题</h1>
        <div class="page-head__meta">
          <span>共 128 个接口</span><span class="sep"></span><span>3 个分组</span>
        </div>
      </div>
      <div class="page-head__actions">
        <button class="btn" type="button">次要动作</button>
        <button class="btn btn--primary" type="button">主要动作</button>
      </div>
    </header>

    <!-- 页面内容 -->
  </main>
</div>

<script src="assets/desk.js"></script>
