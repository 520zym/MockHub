<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MockHub 登录设计稿 · 方向 A 工作台入口</title>
<style>
  :root{
    --page:#eef2f7; --surface:#fff; --ink:#161b23; --muted:#6a7483; --line:#dce3ed;
    --blue:#3568d4; --blue-dark:#234b9f; --soft:#eaf0fb; --green:#1b7a58;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  button,input{font:inherit}
  .shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(400px,.82fr);gap:16px;padding:16px}
  .story{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(145deg,#fafcff 0%,#eef4fc 64%,#e5edf8 100%);border:1px solid #e1e8f2;padding:30px 36px 24px;display:flex;flex-direction:column}
  .story:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ccd9ec 1px,transparent 1px);background-size:26px 26px;opacity:.36;pointer-events:none}
  .brand{position:relative;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .mark{width:34px;height:34px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
  .brand small{margin-left:2px;color:#7e8ba0;font:10px/1.4 var(--mono);letter-spacing:.12em;font-weight:400}
  .stage{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:12px 0 0}
  .stage h1{position:relative;margin:0 0 4px;font-size:clamp(26px,3vw,40px);line-height:1.22;letter-spacing:-.055em;font-weight:720}
  .stage h1 em{font-style:normal;color:var(--blue)}
  .flow{position:relative;width:100%;max-width:720px;height:auto;display:block;margin:0 auto;overflow:visible}
  .story-foot{position:relative;display:flex;justify-content:space-between;gap:12px;color:#8390a3;font:10px/1.6 var(--mono);padding-top:14px}
  .login-side{display:flex;align-items:center;justify-content:center;padding:28px}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px}
  .login-card h2{margin:0 0 22px;font-size:25px;line-height:1.2;letter-spacing:-.04em;font-weight:700}
  label{display:block;margin-top:13px;color:#4b5666;font-size:12px;font-weight:500}
  input{width:100%;margin-top:7px;padding:11px 12px;border:1px solid transparent;border-radius:9px;background:#f5f7fa;color:var(--ink);outline:none;font-size:13px}
  input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(53,104,212,.12)}
  .enter{width:100%;margin-top:21px;padding:11px 14px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
  .enter:hover{background:var(--blue-dark)}
  .fine{margin:14px 0 0;color:#8b96a6;font-size:11px;line-height:1.7}
  .draft{position:fixed;right:14px;bottom:12px;padding:5px 9px;border:1px solid #d2dbe8;border-radius:999px;background:rgba(255,255,255,.85);color:#758196;font:10px/1.4 var(--mono);z-index:9}
  /* line-art motion: request -> match -> response */
  .flow .wire{fill:none;stroke:#c9d6e8;stroke-width:1.5;stroke-dasharray:4 6}
  .flow .card{fill:#fff;stroke:#d8e2ef;stroke-width:1}
  .flow .chip{fill:#e5f3eb}.flow .chip-label{fill:var(--green);font:700 11px var(--mono);text-anchor:middle;letter-spacing:.03em}
  .flow .line{fill:#e8eef7}.flow .line.short{fill:#dbe5f2}
  .flow .code{fill:#8090a5;font:11px var(--mono)}
  .flow .status{fill:#e5f3eb}.flow .status-label{fill:var(--green);font:700 12px var(--mono);text-anchor:middle}
  .flow .hub-ring{fill:none;stroke:var(--blue);stroke-width:1;opacity:.3;transform-box:fill-box;transform-origin:center;animation:ring 7.2s ease-out infinite}
  .flow .hub-core{fill:var(--blue);transform-box:fill-box;transform-origin:center;animation:beat 7.2s ease-in-out infinite}
  .flow .hub-mark{fill:#fff;font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
  .flow .rule{fill:#cfdbeb;animation:hit 7.2s linear infinite}.flow .rule.r2{animation-delay:.12s}.flow .rule.r3{animation-delay:.24s}
  .flow .dot{fill:var(--blue);opacity:0}.flow .dot.in{animation:in 7.2s cubic-bezier(.4,0,.2,1) infinite}.flow .dot.out{animation:out 7.2s cubic-bezier(.4,0,.2,1) infinite}
  .flow .response{transform-box:fill-box;transform-origin:center;animation:settle 7.2s ease-out infinite}
  .flow .caret{fill:var(--blue);animation:blink 1.1s steps(1,end) infinite}
  @keyframes in{0%{opacity:0;transform:translateX(0)}4%{opacity:1}26%{transform:translateX(82px);opacity:1}30%,100%{transform:translateX(82px);opacity:0}}
  @keyframes out{0%,52%{opacity:0;transform:translateX(0)}56%{opacity:1}68%{transform:translateX(82px);opacity:1}72%,100%{transform:translateX(82px);opacity:0}}
  @keyframes ring{0%,26%{transform:scale(.86);opacity:.18}36%{transform:scale(1.06);opacity:.5}46%,100%{transform:scale(1);opacity:.24}}
  @keyframes beat{0%,28%{transform:scale(1)}34%{transform:scale(1.06)}40%,100%{transform:scale(1)}}
  @keyframes hit{0%,30%{fill:#cfdbeb}34%,44%{fill:var(--blue)}50%,100%{fill:#cfdbeb}}
  @keyframes settle{0%,70%{transform:translateY(5px);opacity:.35}78%,92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:.35}}
  @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.flow *{animation:none!important}}
  @media(max-width:980px){.shell{grid-template-columns:1fr;padding:10px;gap:10px}.story{padding:24px}.login-side{padding:18px 8px 26px}.stage h1{font-size:30px}.login-card{max-width:400px}}
  @media(max-width:560px){.story{padding:20px;border-radius:18px}.brand small{display:none}.stage{padding-top:8px}.stage h1{font-size:24px}.story-foot{display:none}.login-card{padding:26px 22px;border-radius:18px}}
</style>
</head>
<body>
<div class="shell">
  <section class="story">
    <header class="brand"><span class="mark">M</span><span>MockHub</span></header>
    <div class="stage">
      <h1>接口，<em>在这里</em>。</h1>
      <svg class="flow" viewBox="0 0 720 410" role="img" aria-label="请求经过匹配规则后返回响应的示意图">
        <path class="wire" d="M205 205H300"/><path class="wire" d="M398 205H500"/>
        <circle class="dot in" cx="205" cy="205" r="4.5"/><circle class="dot out" cx="398" cy="205" r="4.5"/>
        <g><rect class="card" x="38" y="150" width="168" height="112" rx="13"/><rect class="chip" x="54" y="166" width="50" height="20" rx="6"/><text class="chip-label" x="79" y="180">GET</text><rect class="line" x="54" y="202" width="112" height="6" rx="3"/><rect class="line short" x="54" y="216" width="78" height="6" rx="3"/><rect class="line short" x="54" y="230" width="54" height="6" rx="3"/></g>
        <g><circle class="hub-ring" cx="348" cy="205" r="53"/><circle class="hub-core" cx="348" cy="205" r="34"/><text class="hub-mark" x="348" y="214">M</text><rect class="rule" x="302" y="276" width="26" height="7" rx="3.5"/><rect class="rule r2" x="335" y="276" width="26" height="7" rx="3.5"/><rect class="rule r3" x="368" y="276" width="22" height="7" rx="3.5"/></g>
        <g class="response"><rect class="card" x="500" y="132" width="182" height="146" rx="13"/><rect class="status" x="516" y="150" width="48" height="20" rx="6"/><text class="status-label" x="540" y="164">200</text><rect class="line" x="516" y="188" width="118" height="7" rx="3.5"/><rect class="line short" x="516" y="204" width="86" height="7" rx="3.5"/><rect class="line short" x="516" y="220" width="104" height="7" rx="3.5"/><rect class="caret" x="516" y="236" width="2" height="13" rx="1"/></g>
      </svg>
    </div>
    <footer class="story-foot"><span>本地部署</span></footer>
  </section>

  <section class="login-side">
    <div class="login-card">
      <h2>登录</h2>
      <form onsubmit="event.preventDefault()">
        <label>用户名<input placeholder="用户名" autocomplete="username" /></label>
        <label>密码<input type="password" placeholder="密码" autocomplete="current-password" /></label>
        <button class="enter" type="submit">进入工作台</button>
      </form>
      <p class="fine">首次登录需修改密码。</p>
    </div>
  </section>
</div>
</body>
</html>
