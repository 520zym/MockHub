data-id="15-settings-assistant"><span class="v-n">15</span>助手与能力</a><a href="#16-settings-mcp" data-id="16-settings-mcp"><span class="v-n">16</span>MCP Server</a><a href="#17-settings-general" data-id="17-settings-general"><span class="v-n">17</span>基础设置</a><a href="#18-settings-logs" data-id="18-settings-logs"><span class="v-n">18</span>日志与保留</a><a href="#19-settings-storage" data-id="19-settings-storage"><span class="v-n">19</span>文件存储</a><h2>登录与安全</h2><a href="#05-login" data-id="05-login"><span class="v-n">05</span>登录</a><a href="#21-password" data-id="21-password"><span class="v-n">21</span>首次登录 · 修改密码</a></nav><main class="v-main"><div class="v-title"><div><h1 id="pageTitle"></h1><p id="pageDescription"></p></div><code id="pageRoute"></code></div><div class="v-stage"><div class="v-viewport"><iframe title="MockHub 页面设计稿" id="frame"></iframe></div></div><footer class="v-foot"><span>1440 × 900 原稿 · 缩放适配当前视窗</span><span>← / → 切换页面，独立页面内可点击菜单继续浏览</span></footer></main></div></div><script>const pages=[{"id":"01-api-list","file":"01-api-list.html","title":"接口管理","description":"团队接口、筛选与批量操作","group":"接口与联调","route":"/apis","width":1440,"height":900},{"id":"06-api-new","file":"06-api-new.html","title":"新建接口","description":"基础信息、默认响应与变量","group":"接口与联调","route":"/apis/new","width":1440,"height":900},{"id":"02-api-edit","file":"02-api-edit.html","title":"REST 接口编辑","description":"多返回体、JSON 与匹配规则","group":"接口与联调","route":"/apis/:id/edit","width":1440,"height":900},{"id":"22-match-rules","file":"22-match-rules.html","title":"匹配规则配置","description":"返回体、AND 条件、请求样例与本地试配建议","group":"接口与联调","route":"/apis/:id/edit · 匹配规则状态","width":1440,"height":900},{"id":"20-api-soap","file":"20-api-soap.html","title":"SOAP 接口编辑","description":"WSDL、Operations 与 XML 响应","group":"接口与联调","route":"/apis/:id/edit · SOAP 状态","width":1440,"height":900},{"id":"03-logs","file":"03-logs.html","title":"请求日志","description":"请求明细、响应与命中链路","group":"接口与联调","route":"/logs/request","width":1440,"height":900},{"id":"12-operation-logs","file":"12-operation-logs.html","title":"操作日志","description":"团队审计与配置变更详情","group":"接口与联调","route":"/logs/operation","width":1440,"height":900},{"id":"04-assistant","file":"04-assistant.html","title":"对话助手","description":"上下文、待确认变更与差异","group":"接口与联调","route":"全局助手面板","width":1440,"height":900},{"id":"07-files","file":"07-files.html","title":"文件服务器","description":"文件列表、别名标签与预览","group":"工作区与管理","route":"/files","width":1440,"height":900},{"id":"08-variables","file":"08-variables.html","title":"动态变量","description":"变量、候选值与分组三栏","group":"工作区与管理","route":"/variables","width":1440,"height":900},{"id":"09-stats","file":"09-stats.html","title":"使用统计","description":"调用趋势、TOP10 与闲置接口","group":"工作区与管理","route":"/stats","width":1440,"height":900},{"id":"10-teams","file":"10-teams.html","title":"团队管理","description":"团队卡片、成员与角色","group":"工作区与管理","route":"/teams","width":1440,"height":900},{"id":"11-users","file":"11-users.html","title":"用户管理","description":"账号列表、团队分配与重置","group":"工作区与管理","route":"/users","width":1440,"height":900},{"id":"13-mcp-confirm","file":"13-mcp-confirm.html","title":"AI 草稿确认","description":"多返回体预览与确认写入","group":"工作区与管理","route":"/mcp-confirm/:id","width":1440,"height":900},{"id":"14-settings-providers","file":"14-settings-providers.html","title":"设置 · AI 供应商","description":"API 连接、模型与密钥状态","group":"全局设置","route":"/settings · AI 供应商","width":1440,"height":900},{"id":"15-settings-assistant","file":"15-settings-assistant.html","title":"设置 · 助手与能力","description":"四类能力、权限范围与脱敏","group":"全局设置","route":"/settings · 助手与能力","width":1440,"height":900},{"id":"16-settings-mcp","file":"16-settings-mcp.html","title":"设置 · MCP Server","description":"接入协议、工具与访问 Token","group":"全局设置","route":"/settings · MCP Server","width":1440,"height":900},{"id":"17-settings-general","file":"17-settings-general.html","title":"设置 · 基础设置","description":"服务器地址与 Mock CORS","group":"全局设置","route":"/settings · 基础设置","width":1440,"height":900},{"id":"18-settings-logs","file":"18-settings-logs.html","title":"设置 · 日志与保留","description":"条数或天数模式与清理影响","group":"全局设置","route":"/settings · 日志与保留","width":1440,"height":900},{"id":"19-settings-storage","file":"19-settings-storage.html","title":"设置 · 文件存储","description":"存储摘要、扫描与孤儿清理","group":"全局设置","route":"/settings · 文件存储","width":1440,"height":900},{"id":"05-login","file":"05-login.html","title":"登录","description":"内网账号与密码登录","group":"登录与安全","route":"/login","width":1440,"height":900},{"id":"21-password","file":"21-password.html","title":"首次登录 · 修改密码","description":"不可跳过的初始密码更新","group":"登录与安全","route":"/login · 首次登录状态","width":1440,"height":900}];let current=0;const frame=document.getElementById("frame"),stage=document.querySelector(".v-stage"),viewport=document.querySelector(".v-viewport");function fit(){const s=Math.min((stage.clientWidth-20)/1440,(stage.clientHeight-20)/900,1);viewport.style.width=(1440*s)+"px";viewport.style.height=(900*s)+"px";frame.style.transform="scale("+s+")"}function show(){const id=location.hash.slice(1);current=Math.max(0,pages.findIndex(p=>p.id===id));const p=pages[current];frame.src=p.file;document.getElementById("pageTitle").textContent=p.title;document.getElementById("pageDescription").textContent=p.description;document.getElementById("pageRoute").textContent=p.route;document.getElementById("open").href=p.file;document.getElementById("position").textContent=String(current+1).padStart(2,"0")+" / "+pages.length;document.querySelectorAll(".v-nav a").forEach(a=>a.classList.toggle("is-active",a.dataset.id===p.id));fit()}function step(n){location.hash=pages[(current+n+pages.length)%pages.length].id}document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);window.addEventListener("hashchange",show);window.addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});window.addEventListener("message",e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==="mockhub-design-step")step(e.data.step===1?1:-1);if(e.data?.type==="mockhub-design-loaded"){const p=pages.find(p=>p.file===e.data.file);if(p){current=pages.indexOf(p);history.replaceState(null,"","#"+p.id);document.getElementById("pageTitle").textContent=p.title;document.getElementById("pageDescription").textContent=p.description;document.getElementById("pageRoute").textContent=p.route;document.getElementById("open").href=p.file;document.getElementById("position").textContent=String(current+1).padStart(2,"0")+" / "+pages.length;document.querySelectorAll(".v-nav a").forEach(a=>a.classList.toggle("is-active",a.dataset.id===p.id));}}});new ResizeObserver(fit).observe(stage);frame.addEventListener("load",()=>{try{const file=frame.contentWindow.location.pathname.split("/").pop(),p=pages.find(p=>p.file===file);if(p&&p.id!==pages[current].id){history.replaceState(null,"","#"+p.id);current=pages.indexOf(p);document.getElementById("pageTitle").textContent=p.title;document.getElementById("pageDescription").textContent=p.description;document.getElementById("pageRoute").textContent=p.route;document.getElementById("open").href=p.file;document.getElementById("position").textContent=String(current+1).padStart(2,"0")+" / "+pages.length;document.querySelectorAll(".v-nav a").forEach(a=>a.classList.toggle("is-active",a.dataset.id===p.id));}}catch{}});show();</script></body></html>
